name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      # .env is a declared asset; tests don't read it.
      - name: Write placeholder .env
        run: |
          echo "SUPABASE_URL=https://placeholder.supabase.co" > .env
          echo "SUPABASE_PUBLISHABLE_KEY=placeholder" >> .env

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
