name: Main source check

# PRs into main must come from this repo's dev branch.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  source-is-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::PRs into main must come from dev (got $HEAD_REPO:$HEAD_REF). Retarget this PR to dev."
            exit 1
          fi
          echo "Source is dev."
