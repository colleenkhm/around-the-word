name: around_the_word
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.3.0+3

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.6.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management for trip selection (continent/country/categories) and
  # the personalized content, threaded across the map -> categories -> learn/use flow.
  provider: ^6.1.2
  url_launcher: ^6.3.2

  # Extracts a dominant/vibrant color from an image — 2026-08-18, for
  # deriving each country page's accent palette from its own flag PNG
  # (already fetched from flagcdn.com for display). Official Flutter-team
  # package (flutter/packages monorepo), not a third-party dependency.
  palette_generator: ^0.3.3+7
  flutter_dotenv: ^6.0.1

  # IANA-timezone-aware local time — 2026-08-19, once country_facts.timezone
  # (e.g. "Europe/Athens") was wired in server-side. DST-aware on-device,
  # no live call needed.
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/data/countries.json
    - assets/data/subjects.json
    - assets/data/resources.json
    - assets/data/content/
    - assets/data/bundles/
    - .env

  # Bundled locally rather than fetched at runtime (e.g. via a Google
  # Fonts package) so the country-page visual identity holds up under this
  # app's offline-first requirement (see client design doc's Offline
  # Behavior). Archivo/Public Sans/IBM Plex Mono were the light "ticket
  # stock" theme's fonts; Cormorant Garamond/Libre Baskerville/Courier
  # Prime were added 2026-08-15 for the navy/gold "boarding pass" restyle
  # (built against trip-dashboard-v3.html) that replaces it — see
  # CountryTheme's class doc. Left the first three in place rather than
  # removing them: unconfirmed whether anything outside the country page
  # (Language tab, search flow) still depends on them.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
          weight: 500
        - asset: assets/fonts/Archivo-Variable.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Variable.ttf
          weight: 700
        - asset: assets/fonts/Archivo-Variable.ttf
          weight: 800
    - family: Public Sans
      fonts:
        - asset: assets/fonts/PublicSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/PublicSans-Italic-Variable.ttf
          weight: 400
          style: italic
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
          weight: 700
        - asset: assets/fonts/CormorantGaramond-Italic-Variable.ttf
          weight: 600
          style: italic
    - family: Libre Baskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville-Variable.ttf
          weight: 400
        - asset: assets/fonts/LibreBaskerville-Variable.ttf
          weight: 700
        - asset: assets/fonts/LibreBaskerville-Italic-Variable.ttf
          weight: 400
          style: italic
    - family: Courier Prime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
          weight: 400
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
    # Added 2026-08-18 for the accordion-style country-page restyle (built
    # against trip-dashboard-v5.html) — scoped to that screen only (see
    # AccordionTheme's class doc), so Cormorant Garamond/Libre Baskerville/
    # Courier Prime above stay in place for the rest of the app rather than
    # being replaced. Same offline-first reasoning as the fonts above:
    # bundled locally, not fetched via a Google Fonts package at runtime.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 900
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 700
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: assets/fonts/Schyler-Regular.ttf
  #       - asset: assets/fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: assets/fonts/TrajanPro.ttf
  #       - asset: assets/fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
